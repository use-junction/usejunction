# Hobby Vercel only allows once-per-day native crons. Hourly report fan-out is
# triggered here. Secrets live on the agent-production environment (not repo secrets):
#   CRON_SECRET            — same value as Vercel Production
#   CONTROL_PLANE_URL      — e.g. https://usejunction.dev
#   CONTROL_PLANE_URL_EU   — e.g. https://eu.usejunction.dev (optional until EU is live)
name: Production crons

on:
  schedule:
    # Daily report fan-out; app gates on local 19:00
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report-send:
    name: Daily report send (${{ matrix.region }})
    runs-on: ubuntu-latest
    environment: agent-production
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        region: [us, eu]
    concurrency:
      group: production-crons-daily-report-send-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - name: Require environment secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTROL_PLANE_URL: ${{ matrix.region == 'eu' && secrets.CONTROL_PLANE_URL_EU || secrets.CONTROL_PLANE_URL }}
          REGION: ${{ matrix.region }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set agent-production environment secret CRON_SECRET"
            exit 1
          fi
          if [ -z "$CONTROL_PLANE_URL" ]; then
            if [ "$REGION" = "eu" ]; then
              echo "::notice::CONTROL_PLANE_URL_EU is not set; skipping EU cron"
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Set agent-production environment secret CONTROL_PLANE_URL"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_URL=$CONTROL_PLANE_URL" >> "$GITHUB_ENV"
      - name: POST /api/cron/daily-report-send
        if: env.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${CONTROL_PLANE_URL%/}"
          code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" \
            -X POST "$base/api/cron/daily-report-send" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 300)
          echo "HTTP $code"
          cat /tmp/cron-body.json || true
          echo
          test "$code" = "200"

name: Agent release to npm and Homebrew

# Publishes the `usejunction` npm package (so `npx usejunction` runs that
# release) and updates the Homebrew formula. Agent release control calls it
# after a release is promoted; it can also be run by hand to retry. Each half
# is skipped when its secret is absent, and npm skips a version it already has.
#
# Inputs reach scripts through env, never pasted into a `run:` block.
on:
  workflow_call:
    inputs:
      version:
        description: "Promoted agent version, for example 0.5.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Promoted agent version, for example 0.5.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    name: Publish the npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: ties the package to this workflow run.
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $VERSION" >&2; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish usejunction to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: ./scripts/publish-npm-wrapper.sh "$VERSION"
      - name: Skipped
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not set, so nothing was published to npm."

  homebrew:
    name: Update the Homebrew formula
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $VERSION" >&2; exit 1; }'
      - uses: actions/checkout@v4
      - name: Write the formula
        run: ./scripts/build-homebrew-formula.sh "$VERSION" > "$RUNNER_TEMP/usejunction.rb"
      - name: Push it to use-junction/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/use-junction/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/usejunction.rb" "$RUNNER_TEMP/tap/Formula/usejunction.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "usejunction-release"
          git config user.email "release@usejunction.dev"
          git add Formula/usejunction.rb
          if git diff --cached --quiet; then
            echo "The formula is already at ${VERSION}."
          else
            git commit -m "usejunction ${VERSION}"
            git push
          fi
      - name: Skipped
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set, so the tap was not updated."
